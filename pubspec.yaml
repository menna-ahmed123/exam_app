name: exam_app
description: "A Flutter demo application with clean architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1

  # Networking
  dio: ^5.8.0+1
  retrofit: ^4.9.0
  json_annotation: ^4.12.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^15.1.2

  # Local Storage
  flutter_secure_storage: ^9.2.4

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  retrofit_generator: ^10.2.7
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#02369C"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#02369C"
    theme_color: "#02369C"
  macos:
    generate: true
    image_path: assets/images/app_icon.png
  windows:
    generate: true
    image_path: assets/images/app_icon.png

flutter_native_splash:
  color: "#02369C"
  image: assets/images/app_icon.png
  android_12:
    color: "#02369C"
    image: assets/images/app_icon.png
    icon_background_color: "#02369C"
  ios: true
  android: true
  web: true
  fullscreen: true
